# {{product}} {{server.version}} server for the generated programs, HTTP API on port {{http.port}}.
# Data persists in the named volume {{storage.volume}} ({{storage.path}} in the container, the persist_path of the image's
# /config.yaml); docker compose down -v removes it. The open-source server has no authentication, so it listens on
# 127.0.0.1 only. Settings override the config file through CHROMA_ environment variables.
# Start with: docker compose up -d   Health: http://localhost:{{http.port}}/api/v2/heartbeat
# The image has no curl or wget; the health check uses bash's /dev/tcp.
services:
  chroma:
    image: {{server.image}}
    ports:
      - "127.0.0.1:{{http.port}}:8000"
    volumes:
      - {{storage.volume}}:{{storage.path}}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  {{storage.volume}}:
