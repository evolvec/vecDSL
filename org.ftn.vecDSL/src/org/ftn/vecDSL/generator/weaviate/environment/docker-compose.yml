# {{product}} {{server.version}}, single node, anonymous access, no vectorizer modules. Modules: backup-filesystem
# (backups under the data volume) and generative-dummy (deterministic text, no model or key). OBJECTS_TTL_DELETE_SCHEDULE
# enables object ttl; RUNTIME_REINDEX_ENABLED enables the property index endpoints.
# Start with: docker compose up -d   Ports: {{server.port}} (HTTP), {{grpc.port}} (gRPC).
services:
  weaviate:
    image: {{image.weaviate}}
    command:
      - --host
      - 0.0.0.0
      - --port
      - '{{server.port}}'
      - --scheme
      - http
    ports:
      - "{{server.port}}:{{server.port}}"
      - "{{grpc.port}}:{{grpc.port}}"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      ENABLE_MODULES: backup-filesystem,generative-dummy
      BACKUP_FILESYSTEM_PATH: /var/lib/weaviate/backups
      OBJECTS_TTL_DELETE_SCHEDULE: '0 */6 * * *'
      RUNTIME_REINDEX_ENABLED: 'true'
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:{{server.port}}/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure:0

volumes:
  weaviate_data:
