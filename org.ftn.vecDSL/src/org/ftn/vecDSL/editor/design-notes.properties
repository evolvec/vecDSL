# Design decisions D1 to D15 of vecDSL 7.1, one sentence each, as the grammar states them
# (VecDSL.xtext header, rule comments and the REMOVED IN V7 table). Shown in keyword hovers.
D1=The generation target is a generator parameter, never part of the program; 'targets [..]' is an optional restriction checked against the vendor capability tables.
D2=A parameter that only one vendor offers is not a keyword: it is an open vendor parameter (key = value) in an 'extension <vendor> { }' block, validated against that vendor's capability manifest.
D3=Every score the language exposes is a similarity, higher is better, with a fixed range per metric; 'bounds' constrain this canonical similarity, and 'score native' switches to the engine's own form, which is not portable.
D4=A vector index is described by its family, accelerator, structural parameters (max-degree, build-candidates, search-candidates, centroids) and quantization; vendor index parameters go into an extension block.
D5=A collection holds one or more vector fields; a query chooses one with 'using', and adding or dropping a vector field is an ordinary field operation.
D6=A field is referenced by its simple name and resolved in the collection the statement addresses.
D7=Common record attribute names (title, score, version, name, type, text, id, status, ...) are soft keywords that remain usable as names; '^' escapes any other keyword.
D8=Scoring is generic: a boost block of field-value, decay and condition boost functions and their combination; phased ranking profiles live in the vespa extension.
D9=Copy-on-write and materialized copies of a collection or database are one statement, 'clone ... mode shallow|snapshot'.
D10=Secondary indexes over payload fields are generic payload indexes (kind and structure); engine configuration such as Qdrant segment optimizers and Weaviate inverted index settings moved into extension blocks.
D11=The storage layout of an index is not part of the language ('storage-layout' was removed).
D12=A deployment ('database') holds its connection, clusters and logical databases; a cluster holds collections with replication and sharding.
D13=Vendor names occur only in VendorId, in extension sections and in comments; enumerations are vendor-neutral and providers are strings checked against a catalogue.
D14=Weaviate preview features are available only as PROVISIONAL constructs of the weaviate extension.
D15=A declared recall floor is written 'target-recall q' in search params, 0 < q < 1; recall 1 is written 'exact'.
