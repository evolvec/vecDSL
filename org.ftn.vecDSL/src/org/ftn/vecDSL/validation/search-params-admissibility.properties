# Admitted SearchParams keys per query form, keyed by the class of the element that owns 'params'.
# Single source of truth for the validator (WF-Recall (c) and the generic admissibility check)
# and for the grammar export (tools/grammar_report.py). A key missing from a form's list is not
# admitted on that form. Keys are the surface keywords of SearchParams; 'extension' stands for
# vendor extension blocks inside params.
#
# v7.0 admitted every key on every form that has 'params'; v7.1 withholds 'target-recall'
# from KeywordSearch (BM25 over an inverted index is exact) and from the HybridSearch level
# (approximate retrieval happens in its vector legs, which admit the key).
VectorSearch=target-recall,candidates,probes,scan-budget,timeout,oversampling,rescore,filter-strategy,exhaustive,extension
RecommendSearch=target-recall,candidates,probes,scan-budget,timeout,oversampling,rescore,filter-strategy,exhaustive,extension
VectorLeg=target-recall,candidates,probes,scan-budget,timeout,oversampling,rescore,filter-strategy,exhaustive,extension
Prefetch=target-recall,candidates,probes,scan-budget,timeout,oversampling,rescore,filter-strategy,exhaustive,extension
KeywordSearch=candidates,probes,scan-budget,timeout,oversampling,rescore,filter-strategy,exhaustive,extension
HybridSearch=candidates,probes,scan-budget,timeout,oversampling,rescore,filter-strategy,exhaustive,extension
