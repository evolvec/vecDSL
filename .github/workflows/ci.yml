# vecDSL continuous integration. Every job calls one script under ci/, which runs the same way on a developer machine
# (ci/README.md); the expected numbers are in ci/expected.env. No job needs a vendor server: the generators are
# headless, and the runs against live vendor instances are a release-time step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  coverage-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash ci/coverage-index.sh

  build-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash ci/build-cli.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vecdsl-cli-jar
          path: vecdsl-cli/target/vecdsl-cli.jar
          if-no-files-found: error

  build-lsp:
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: vecdsl-cli-jar
          path: vecdsl-cli/target
      - run: bash ci/build-lsp.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vecdsl-lsp-jar
          path: vecdsl-lsp/target/vecdsl-lsp.jar
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash ci/tests.sh
      - uses: actions/upload-artifact@v7
        with:
          name: generated-by-tests
          path: org.ftn.vecDSL.tests/generated
          if-no-files-found: error
          retention-days: 7

  build-extension:
    needs: build-lsp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vscode-vecdsl/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: vecdsl-lsp-jar
          path: vecdsl-lsp/target
      - run: bash ci/build-extension.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-vecdsl-vsix
          path: ci/.work/*.vsix
          include-hidden-files: true
          if-no-files-found: error

  # Optional: a failure here does not fail the workflow. VS Code is downloaded by @vscode/test-electron and runs under
  # xvfb-run.
  extension-integration:
    needs: build-lsp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vscode-vecdsl/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: vecdsl-lsp-jar
          path: vecdsl-lsp/target
      - run: bash ci/build-extension.sh
      - run: bash ci/extension-integration.sh

  samples:
    needs: [build-cli, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: vecdsl-cli-jar
          path: vecdsl-cli/target
      - uses: actions/download-artifact@v8
        with:
          name: generated-by-tests
          path: org.ftn.vecDSL.tests/generated
      - run: bash ci/samples.sh

  site:
    needs: [coverage-index, build-cli, build-lsp, tests, build-extension, samples]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: vecdsl-cli-jar
          path: vecdsl-cli/target
      - run: CI_RUN="passing, run ${GITHUB_RUN_NUMBER}, $(date -u +%Y-%m-%d)" bash ci/site.sh
      - uses: actions/upload-artifact@v7
        with:
          name: capability-matrix
          path: coverage-site/site
          if-no-files-found: error
      # GitHub Pages, once the repository is public: uncomment this step and the deploy-pages job below, and set
      # Settings > Pages > Source to "GitHub Actions".
